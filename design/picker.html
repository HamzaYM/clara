<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Clara — Who's there?</title>
<link rel="stylesheet" href="clara.css" />
<link rel="stylesheet" href="clara-pages.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  .pp-page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 32px;
    text-align: center;
    gap: 56px;
  }
  .pp-greet { font-family: var(--font-display); font-weight: 400; font-size: 56px; letter-spacing: -0.02em; line-height: 1.05; margin: 0; text-wrap: balance; }
  .pp-greet em { font-style: italic; color: var(--accent-ink); }
  .pp-sub { font-family: var(--font-display); font-size: 22px; color: var(--ink-soft); margin: 16px 0 0; max-width: 540px; line-height: 1.5; }

  .pp-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 32px;
    max-width: 880px;
    width: 100%;
  }
  @media (max-width: 720px) {
    .pp-grid { grid-template-columns: repeat(2, 1fr); gap: 20px; }
    .pp-greet { font-size: 36px; }
  }

  .pp-card {
    appearance: none;
    border: 0;
    background: transparent;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 12px;
    color: inherit;
    font: inherit;
    border-radius: var(--radius);
    transition: transform .2s ease;
  }
  .pp-card:hover { transform: translateY(-4px); }
  .pp-card:hover .pp-avatar { box-shadow: 0 0 0 4px var(--accent-soft), 0 12px 32px rgba(42,38,34,.14); }

  .pp-avatar {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: var(--avatar-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 56px;
    color: var(--avatar-ink);
    letter-spacing: -0.02em;
    border: 0.5px solid var(--rule);
    box-shadow: var(--shadow-soft);
    transition: box-shadow .2s ease;
    position: relative;
  }
  .pp-avatar.add {
    background: transparent;
    border: 1.5px dashed var(--rule-strong);
    color: var(--ink-faint);
    font-size: 44px;
    font-weight: 300;
  }
  .pp-name {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 500;
    letter-spacing: -0.005em;
  }
  .pp-relation {
    font-family: var(--font-mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
  }
  .pp-letters {
    margin-top: 4px;
    font-size: 14px;
    color: var(--ink-soft);
  }
  .pp-flag {
    position: absolute;
    bottom: 4px;
    right: 4px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--bg);
    border: 0.5px solid var(--rule);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    box-shadow: var(--shadow-soft);
  }

  .pp-foot {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    color: var(--ink-faint);
    font-size: 14px;
  }
  .pp-foot a { color: var(--ink-soft); text-decoration: none; border-bottom: 1px solid var(--rule); }
  .pp-foot a:hover { color: var(--ink); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="options-panel.jsx"></script>
<script type="text/babel" src="clara-tweaks.jsx"></script>
<script type="text/babel" src="clara-content.jsx"></script>
<script type="text/babel" src="clara-components.jsx"></script>
<script type="text/babel">
function ProfilePicker() {
  const [t, setTweak] = useClaraTweaks();
  const lang = t.language;

  // Avatar palette per profile — picks accent palette for that profile
  const avatarStyle = (p) => {
    const pal = ACCENT_PALETTES[p.accent] || ACCENT_PALETTES.sage;
    return { '--avatar-bg': pal.soft, '--avatar-ink': pal.ink };
  };

  const flagFor = (lang) => lang === 'fr' ? '🇫🇷' : lang === 'ur' ? 'اُر' : lang === 'es' ? '🇪🇸' : 'EN';

  const onPick = (p) => {
    setTweak({ activeProfile: p.id, language: p.language, accent: p.accent });
    setTimeout(() => { window.location.href = 'upload.html'; }, 200);
  };

  const greetCopy = {
    en: { hi: "Welcome back to Clara.", sub: "Whose mail are we looking at today?" },
    fr: { hi: "Bon retour sur Clara.", sub: "Le courrier de qui regardons-nous aujourd'hui ?" },
    ur: { hi: "کلارا میں خوش آمدید۔", sub: "آج کس کا خط دیکھنا ہے؟" },
  }[lang];

  return (
    <div className="pp-page" data-screen-label="00b Profile picker">
      <div>
        <ClaraLogo size="" />
      </div>

      <div className="fade-up">
        <h1 className="pp-greet">{greetCopy.hi}</h1>
        <p className="pp-sub">{greetCopy.sub}</p>
      </div>

      <div className="pp-grid fade-up fade-up-2">
        {CLARA_PROFILES.slice(0, 3).map(p => (
          <button key={p.id} className="pp-card" onClick={() => onPick(p)}>
            <div className="pp-avatar" style={avatarStyle(p)}>
              {p.initials}
              <span className="pp-flag">{flagFor(p.language)}</span>
            </div>
            <div>
              <div className="pp-relation">{p.relation}</div>
              <div className="pp-name">{p.name}</div>
              <div className="pp-letters">{p.letters} {lang === 'fr' ? 'lettres' : lang === 'ur' ? 'خطوط' : 'letters'}</div>
            </div>
          </button>
        ))}
        <button className="pp-card" onClick={() => alert('Add a new profile — coming soon')}>
          <div className="pp-avatar add">＋</div>
          <div>
            <div className="pp-relation">{lang === 'fr' ? 'Nouveau' : lang === 'ur' ? 'نیا' : 'New'}</div>
            <div className="pp-name">{lang === 'fr' ? 'Ajouter' : lang === 'ur' ? 'شامل کریں' : 'Add someone'}</div>
            <div className="pp-letters muted">{lang === 'fr' ? 'Parent, ami…' : lang === 'ur' ? 'گھر والا، دوست…' : 'A parent, friend…'}</div>
          </div>
        </button>
      </div>

      <div className="pp-foot fade-up fade-up-3">
        <span>{lang === 'fr' ? 'Vous êtes connecté en tant que' : lang === 'ur' ? 'آپ بطور لاگ ان' : 'Signed in as'} <a href="account.html">caregiver@email.com</a></span>
        <a href="setup.html" style={{marginTop:8, fontSize:13, border:0}}>{lang === 'fr' ? 'Configurer un nouveau profil' : lang === 'ur' ? 'نیا پروفائل بنائیں' : 'Set up a new profile from scratch'} →</a>
      </div>

      <ClaraTweaksPanel tweaks={t} setTweak={setTweak} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ProfilePicker />);
</script>
</body>
</html>
