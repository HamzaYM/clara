<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Clara — My letters</title>
<link rel="stylesheet" href="clara.css" />
<link rel="stylesheet" href="clara-pages.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="options-panel.jsx"></script>
<script type="text/babel" src="clara-tweaks.jsx"></script>
<script type="text/babel" src="clara-content.jsx"></script>
<script type="text/babel" src="clara-components.jsx"></script>
<script type="text/babel">
function ProfileApp() {
  const [t, setTweak] = useClaraTweaks();
  const lang = t.language;
  const ui = UI_STRINGS[lang];

  const categories = ['Government', 'Health', 'Financial', 'Other'];
  const grouped = categories.map(c => ({
    name: c,
    label: ui.profile[c],
    letters: CLARA_LETTERS.filter(l => l.category === c),
  })).filter(g => g.letters.length > 0);

  return (
    <>
      <TopNav active="profile" lang={lang} />
      <main className="shell" data-screen-label="04 Profile">
        <section className="profile-hero fade-up">
          <div className="h-mono" style={{marginBottom:12}}>
            {lang === 'fr' ? 'Bonjour, Elena' : lang === 'ur' ? 'سلام، ایلینا' : 'Hello, Elena'}
          </div>
          <h1 className="h-display">{lang === 'fr' ? 'Vos lettres' : lang === 'ur' ? 'آپ کے خطوط' : 'Your letters'}</h1>
          <p>{lang === 'fr' ? 'Tout ce que nous avons reçu pour vous, organisé par catégorie.' : lang === 'ur' ? 'آپ کے سب خطوط، قسم کے حساب سے ترتیب میں۔' : 'Everything we\'ve received for you, sorted into a tidy filing cabinet.'}</p>
        </section>

        {grouped.map(g => (
          <section key={g.name} className="category-section fade-up">
            <div className="category-head">
              <h2>{g.label}</h2>
              <span className="category-count">{g.letters.length} {g.letters.length === 1 ? 'letter' : 'letters'}</span>
            </div>
            <div className="category-grid">
              {g.letters.map(l => <LetterCard key={l.id} letter={l} lang={lang} variant={t.card} />)}
            </div>
          </section>
        ))}
      </main>

      <ClaraTweaksPanel tweaks={t} setTweak={setTweak} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ProfileApp />);
</script>
</body>
</html>
