<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Clara — Setup</title>
<link rel="stylesheet" href="clara.css" />
<link rel="stylesheet" href="clara-pages.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="options-panel.jsx"></script>
<script type="text/babel" src="clara-tweaks.jsx"></script>
<script type="text/babel" src="clara-content.jsx"></script>
<script type="text/babel" src="clara-components.jsx"></script>
<script type="text/babel">
function SetupApp() {
  const [t, setTweak] = useClaraTweaks();
  const [name, setName] = React.useState('');
  const [language, setLanguage] = React.useState('en');
  const [email, setEmail] = React.useState('');

  const onSubmit = (e) => {
    e.preventDefault();
    setTweak('language', language);
    window.location.href = 'upload.html';
  };

  return (
    <div className="setup-page" data-screen-label="01 Setup">
      <div className="setup-left fade-up">
        <div className="setup-hero">
          <ClaraLogo size="lg" />
          <h1 className="h-display">A patient helper for the letters that matter.</h1>
          <p>Snap a photo of a confusing letter — government, medical, financial — and Clara explains it in your language, gently, with a calm voice and a draft reply ready to send.</p>
        </div>
        <div className="setup-illus">
          <div className="paper-stack">
            <div className="p1"></div>
            <div className="p2"></div>
            <div className="p3"></div>
          </div>
          <div style={{paddingBottom:24, color:'var(--ink-faint)', fontSize:15, fontStyle:'italic', fontFamily:'var(--font-display)', maxWidth:240, lineHeight:1.5}}>
            "It's the visual equivalent of a kind nurse sitting at the kitchen table."
          </div>
        </div>
      </div>

      <div className="setup-right fade-up fade-up-2">
        <form className="setup-form" onSubmit={onSubmit}>
          <div className="seal"><span className="seal-dot"></span><span>Let's get acquainted</span></div>
          <h2>Who are we helping?</h2>

          <div className="field">
            <label>Your name</label>
            <input type="text" placeholder="Elena Rodriguez" value={name} onChange={(e)=>setName(e.target.value)} />
          </div>

          <div className="field">
            <label>Preferred language</label>
            <select value={language} onChange={(e)=>setLanguage(e.target.value)}>
              <option value="en">English</option>
              <option value="es">Español</option>
              <option value="zh">中文 (Mandarin)</option>
              <option value="pt">Português</option>
              <option value="ht">Kreyòl ayisyen</option>
              <option value="vi">Tiếng Việt</option>
              <option value="ar">العربية</option>
              <option value="fr">Français</option>
              <option value="ur">اردو</option>
            </select>
            <span className="field-hint">We'll explain every letter and read it aloud in this language.</span>
          </div>

          <div className="field">
            <label>Caregiver email <span style={{color:'var(--ink-faint)', fontWeight:400}}>— optional</span></label>
            <input type="email" placeholder="daughter@email.com" value={email} onChange={(e)=>setEmail(e.target.value)} />
            <span className="field-hint">We'll send them a heads up when something important comes in. Nothing else.</span>
          </div>

          <button type="submit" className="btn btn-primary btn-lg" style={{marginTop:8, width:'fit-content'}}>
            Get started <Icon name="arrow" size={18} />
          </button>
          <p style={{margin:'4px 0 0', fontSize:13, color:'var(--ink-faint)'}}>No password needed. We'll keep things simple.</p>
        </form>
      </div>

      <ClaraTweaksPanel tweaks={t} setTweak={setTweak} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<SetupApp />);
</script>
</body>
</html>
